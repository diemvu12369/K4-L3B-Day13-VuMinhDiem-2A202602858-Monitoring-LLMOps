alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602858
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailure
    severity: critical
    condition: 'error_rate_pct > 2 or tool_success_rate_pct(tool_name == "retrieval") < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602858
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-2
  - name: CostPerRequestSpike
    severity: warning
    condition: 'avg(response_sent.cost_usd) > 0.004 or sum(cost_usd) over 1h > 0.104'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602858
    guardrail: daily_cost_usd_max
    runbook: docs/alerts.md#alert-3
